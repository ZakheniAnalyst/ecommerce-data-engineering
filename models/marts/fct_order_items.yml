version: 2

models:
  - name: fct_order_items
    columns:
      - name: order_item_id
        tests:
          - unique
          - not_null

      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: PRODUCT_ID

      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: CUSTOMER_ID

  - name: fct_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: CUSTOMER_ID

  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: dim_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
